# 설계 명세 v3 기준 하이퍼파라미터
model:
  d_model: 256
  n_heads: 8
  ffn_dim: 1024
  backbone_layers: 2        # 오디오/비주얼 프론트엔드 TransformerEncoder 층 수
  num_classes: 8            # angry, disgust, fear, happy, sad, surprise, contempt, neutral
  prosody_dim: 10           # features/prosody.py 참고
  # --- 과적합 대응(2차 학습, 100에폭 중 12에폭 이후 val_acc 정체/val_loss 상승 관찰) ---
  cross_attn_dropout: 0.2       # 0.1 -> 0.2
  backbone_dropout: 0.2         # 오디오/비주얼 TemporalConvFrontend, 신규(기존 하드코딩 0.1)
  visual_cnn_dropout: 0.15      # FrameCNN(MobileNetV3) 풀링 후 dropout
  classifier_dropout: 0.35      # 0.2 -> 0.35 (최종 MLP, 3개 모달리티 concat이라 용량 큼)
  text_dropout: 0.2             # BERT 내부 hidden/attention dropout, 0.1 -> 0.2
  text_freeze_layers: 8         # klue/bert-base 12층 중 하위 8층+embeddings 동결(상위 4층만 미세조정)
  visual_freeze_layers: 9       # 8.7절 대응: MobileNetV3-Small(13블록) 사전학습 백본으로 교체, 하위 9개 동결(상위 4개만 미세조정 — BERT와 같은 비율)

text:
  pretrained_model: "klue/bert-base"

audio:
  sample_rate: 16000
  n_mels: 80
  n_fft: 400
  hop_length: 160

visual:
  face_size: 112            # ABAW 전처리 관례(112x112)와 동일

train:
  batch_size: 128   # A100 80GB인데 16일 땐 GPU 메모리 6.4GB(8%)만 씀 -> 훨씬 키워서 GPU 활용도 올림
  epochs: 100   # 80,122개(14배 늘어난 데이터)로 재학습 — 300은 이 규모엔 과함 판단, 100으로 시작
  lr: 0.0002
  # --- 과적합 대응(2차 학습) ---
  weight_decay: 0.05        # 0.01 -> 0.05
  modality_dropout_prob: 0.25   # 설계 v3 9절: 학습 시 모달리티 드롭아웃. 0.15 -> 0.25
  label_smoothing: 0.1          # 신규: 정답 라벨 과확신 방지
  lr_scheduler_patience: 3      # 신규: val_loss가 3에폭 연속 개선 안 되면 lr 감소
  lr_scheduler_factor: 0.5      # 신규: 감소 비율(반으로)
  num_workers: 8   # 노트북=0(안전). 전용 GPU 서버에서는 CPU 코어 수에 맞춰 올릴 것(예: 8) — 안 그러면 GPU가 오디오/영상 전처리를 기다리며 놀게 됨
  feature_cache_dir: "data/feature_cache"   # 멜스펙트로그램/운율/얼굴프레임 계산 결과 캐시 — 첫 에폭 이후 훨씬 빨라짐
  train_manifest: "data/manifests/train.csv"
  val_manifest: "data/manifests/val.csv"
  test_manifest: "data/manifests/test.csv"
  checkpoint_dir: "checkpoints"                    # 최고 성능(best_model.pt) 전용
  periodic_checkpoint_dir: "checkpoints_periodic"  # N에폭마다 스냅샷 저장 (checkpoint_epoch20.pt, ...)
  checkpoint_interval: 20

labels:
  # 순서가 곧 클래스 인덱스 (0~7). src/datasets/labels.py EMOTION_LABELS와 반드시 일치시킬 것
  - angry
  - disgust
  - fear
  - happy
  - sad
  - surprise
  - contempt
  - neutral
