# v11c — v11a + wav2vec2 24층. config_noise_aug.yaml(v11a)에서 **audio.layer 하나만** 바꾼 것.
# 모델 구조·파라미터·분할·선택 기준은 v11과 같고 학습 데이터가 보는 조건만 다르다.
# v13a~d(융합 설계 애블레이션)와 목적이 달라 v11의 변형으로 이름 붙였다.
# 오디오 백본만 멜 -> wav2vec2로 바꾼 것.
#
# 근거(8.18절 / 11.0.1절): 같은 화자 독립 분할·같은 seed·같은 하이퍼파라미터에서
# 오디오 단독 베이스라인을 두 백본으로 돌려 비교한 결과가 결정적이었다.
#
#   멜        최고 val 31.74%  (기준선 27.00% 대비 +4.74%p)
#   wav2vec2  최고 val 39.48%  (기준선 27.00% 대비 +12.48%p)
#
# 기준선 대비 상승폭이 2.6배다. 이 프로젝트에서 단일 변경으로 이만한 개선은 없었다
# (v5 얼굴 크롭 버그 수정이 test +3.05%p, v6 클래스 병합이 +2.16%p).
# 오디오 브랜치가 사실상 무력한 상태에서 실질적 기여자로 바뀔 것으로 기대한다.
#
# **비용을 알고 가야 한다**:
#   - 학습 시간: 오디오 단독 기준 2.0분 -> 16.2분/에폭(8배). 트리모달은 9.5분 -> 약 24분 예상.
#   - 모델 크기: 1.21억 -> 4.37억 파라미터(동결이라 학습분은 836만 -> 876만으로 거의 그대로).
#     추론 비용과 로봇 탑재 부담은 늘어난다(3.7절 경량화 과제와 충돌 — 통합 후 재검토 필요).
#   - epochs를 40으로 낮춘 이유: v9·v10 모두 8~13에폭에서 정점이었다. 40이면 충분하다.
#
# 모델 하이퍼파라미터는 v10과 완전히 동일하게 두어 "오디오 백본 교체" 효과만 분리해서 본다.
model:
  d_model: 256
  n_heads: 8
  ffn_dim: 1024
  backbone_layers: 2
  num_classes: 7
  prosody_dim: 10
  cross_attn_dropout: 0.2
  cross_attn_drop_path: 0.1
  backbone_dropout: 0.2
  visual_cnn_dropout: 0.15
  classifier_dropout: 0.35
  text_dropout: 0.2
  text_freeze_layers: 12
  visual_freeze_layers: 9

text:
  pretrained_model: "klue/bert-base"

audio:
  backbone: "wav2vec2"        # ← v10과 다른 유일한 모델 설정
  # HF 원본이 아니라 로컬 변환본. transformers 최신 버전이 CVE-2025-32434 때문에
  # torch<2.6에서 .bin 로딩을 거부하는데 facebook/wav2vec2-*는 safetensors가 없다.
  # 서버 torch는 2.5.1+cu121이고 올리면 학습 환경이 위험해지므로 가중치만 변환해 쓴다.
  #   python scripts/convert_to_safetensors.py \
  #       --repo facebook/wav2vec2-large-xlsr-53 --out models/wav2vec2-large-xlsr-53
  pretrained_model: "models/wav2vec2-large-xlsr-53"
  # 12를 고른 근거는 "SER은 마지막 층보다 중간 층이 낫다"는 일반론이었다(8.18.2절).
  # **이 전제는 이후 우리 데이터에서 반증됐다**(8.24절): val 전체 11,443개로 층별 프로빙을
  # 해보니 24층(+8.39%p)과 0층(+7.54%p)이 높고 12층(+5.70%p)이 최하위인 U자형이었다.
  # 이 값은 v11 실행 기록이므로 그대로 두고, 새 실험은 configs/config_v12a_layer24.yaml을 쓴다.
  w2v_layer: 24
  w2v_freeze: true            # v7 교훈 — 이 데이터 규모에서 대형 사전학습 모델 파인튜닝은 과적합
  sample_rate: 16000
  n_mels: 80                  # wav2vec2 경로에선 안 쓰이지만 스키마 유지를 위해 남김
  n_fft: 400
  hop_length: 160

visual:
  face_size: 112

train:
  # v10과 동일하게 128을 유지한다. 처음엔 메모리를 걱정해 64로 낮췄는데, 그러면
  # 에폭당 옵티마이저 스텝이 443 -> 886으로 2배가 되어 "wav2vec2 효과"와 "배치 크기 효과"가
  # 섞인다. 실측 추정상 A100 80GB에 여유가 충분하므로(어텐션이 층당 약 0.6GB, 동결이라
  # 활성값도 안 쌓임) 변수를 하나만 바꾸는 쪽을 택했다.
  batch_size: 128
  epochs: 40
  lr: 0.0002
  weight_decay: 0.05
  modality_dropout_prob: 0.25
  label_smoothing: 0.1
  lr_scheduler_patience: 3
  lr_scheduler_factor: 0.5
  num_workers: 8
  feature_cache_dir: "data/feature_cache"

  # 화자 독립 분할 (8.14/8.17절). 재현 명령:
  #   python scripts/split_manifest.py --manifest data/manifests/all.csv \
  #       --out-dir data/manifests_si --unit speaker --seed 2026 --verify
  train_manifest: "data/manifests_si/train.csv"
  val_manifest: "data/manifests_si/val.csv"
  test_manifest: "data/manifests_si/test.csv"
  prosody_stats_path: "data/prosody_stats_train_si.json"

  checkpoint_dir: "checkpoints_v11c"
  periodic_checkpoint_dir: "checkpoints_periodic_v11c"
  # 20으로 둔 이유: 파라미터가 4.37억으로 늘어 체크포인트 1개가 1.63GB다(v10은 0.45GB).
  # 5에폭 간격이면 40에폭에 스냅샷만 13GB이고, 그중 10.6GB는 매번 똑같이 저장되는
  # 동결 wav2vec2 가중치다. 스냅샷의 원래 용도였던 SWA는 두 차례 시도 끝에 효과 없음으로
  # 결론났고(8.15.3절) 그 외 용도는 v6에서 한 번 썼을 뿐이라, 간격을 넓혀 낭비를 줄인다.
  checkpoint_interval: 20

  # ── v11과 다른 유일한 설정 (13.5절) ──────────────────────────────────
  # 발화마다 매 에폭 {깨끗, 20, 10, 5dB} 중 하나를 뽑는다. 25%가 깨끗하게 남으므로
  # 깨끗한 성능을 버리지 않으면서 소음 조건을 같이 배운다.
  #
  # SNR 값의 근거: v11 실측이 SNR 20dB 43.80% / 10dB 36.85%(깨끗 46.19%)이고,
  # 일반 가정의 음성 환경이 그 구간이다. 5dB는 그보다 나쁜 쪽 여유로 넣는다.
  # (results/eval/v11_noise*.json — (발화, SNR) 시드, 서버 CUDA에서 잰 값.)
  #
  # **val에는 안 들어간다** — train.py가 train_ds에만 넘긴다. 체크포인트 선택이
  # val_accuracy 기준이라 val을 오염시키면 선택 기준이 v11과 달라져 비교가 깨진다.
  noise_aug_snrs: [20, 10, 5]

  # scripts/precompute_noisy_prosody.py --snr 20 10 5 --workers 16 로 미리 만든다.
  # 없으면 데이터셋이 __init__에서 죽는다(조용히 깨끗한 운율로 흘러가지 않게).
  noisy_prosody_dir: "data/noisy_prosody"

  # wav2vec2 출력 캐시(13.6절). 동결 백본이 스텝 시간의 84%라 미리 뽑아둔 것을 읽는다.
  # 18분/에폭 -> 약 3분. 값은 파형 경로와 로짓 5e-4 안에서 같다(tests/test_w2v_cache.py).
  # scripts/precompute_w2v_cache.py 로 만든다. 없으면 데이터셋이 __init__에서 죽는다.
  w2v_cache_dir: "data/w2v_cache_l24"

  # ── v11a와 다른 유일한 설정: audio.w2v_layer 12 -> 24 ─────────────────────────
  # 화자 독립 선형 프로브(scripts/probe_audio_backbones.py, 13.11절)에서 XLSR-53의 24층이
  # 12층보다 7클래스 +4.84%p였다(35.03 vs 30.19). 8~20층은 평평하고 22층부터 뛴다.
  # 기록의 v12a(24층) "실패"는 시드 1개·-1.45%p로 시드 편차(±1) 안이라 재판정한다.
  # 캐시는 층이 다르므로 별도 디렉터리(w2v_cache_l24).
