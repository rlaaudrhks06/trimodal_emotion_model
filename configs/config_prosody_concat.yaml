# v13d — 운율 게이트 기구 애블레이션. v11에서 **prosody_fusion 하나만** 바꾼다.
#
# config_prosody_none.yaml(운율 자체를 뺀다)과 짝이다. 둘을 같이 돌려야 두 질문이
# 분리된다 — 하나만으로는 못 가른다:
#
#   v11 (gate)  vs  concat   ->  **게이트 기구**가 값을 하는가
#   concat      vs  none     ->  **운율 정보**가 값을 하는가
#
# 왜 이 조건이 필요해졌나. v11 체크포인트에서 게이트 g를 직접 재봤다
# (scripts/inspect_prosody_gate.py, 96발화 x 512차원, 결과는 커밋 65dcfdd):
#
#   - 게이트는 죽어 있지 않다. 512차원 중 298개가 운율 쪽으로 기울어 있고
#     발화마다 차원별로 크게 재배분한다(발화별 변동 0.2278 vs 차원 간 차이 0.0998)
#   - 그런데 소음이 와도 **총량을 안 옮긴다.** SNR 10dB에서 방향은 유의하지만
#     (73/96 발화, 이항검정 p=1.56e-07) 옮긴 양이 평소 변동의 5.5%다.
#     같은 조건에서 정확도는 46.19% -> 36.85%인데 g는 0.4854 -> 0.4730만 움직였다
#     (서버 CUDA 기준. Mac에서 재면 깨끗 g가 0.4895로 0.004 다르다 — fp16 autocast 등
#      백엔드 차이이고, 이후 모든 수치는 서버를 기준으로 한다.)
#
# 즉 게이트가 하는 일이 "입력에 따라 비중 조절"이 아니라 사실상 고정 배합에 가까울 수
# 있다. 그렇다면 sigmoid 게이팅 기구는 값을 못 하는 것이고 단순 선형 결합으로 같은
# 성능이 나와야 한다. 이 config가 그것을 잰다.
#
# **파라미터가 거의 같아 비교가 깨끗하다:**
#   gate   273,408  (prosody_proj 5,632 + gate Linear 267,776)
#   concat 267,776  (Linear(hybrid+prosody -> hybrid) 하나)
#   차이 5,632개(2%) — 성능 차이가 나면 파라미터 수가 아니라 기구 자체의 값어치다.
#
# 판정 후:
#   gate ≈ concat  -> 게이트 기구를 걷어낸다. 젯슨 배포가 그만큼 가벼워진다
#   gate >  concat -> 게이팅이 실제로 일한다. 소음 반응이 약한 것은 별개 문제이고
#                     제안서 3.1.5 ②의 "게이트 재설계"는 그 축으로 간다
#   concat ≈ none  -> 운율 10차원 자체가 값을 못 한다. librosa.pyin이 전처리에서
#                     통째로 사라지고 feature_cache의 존재 이유도 없어진다
#
# 비교 규칙(8.29.5절): 차이의 표준오차 약 0.66%p, 1.3%p 미만은 결론을 내지 않는다.
# 세 조건 모두 --save-predictions로 발화별 예측을 저장해 짝지어 검정(McNemar)한다.
#
# 평가:
#   python scripts/evaluate.py --config configs/config_prosody_concat.yaml \
#       --checkpoint checkpoints_prosody_concat/best_model.pt \
#       --save-as v13d --save-predictions

model:
  d_model: 256
  n_heads: 8
  ffn_dim: 1024
  backbone_layers: 2
  num_classes: 7
  prosody_dim: 10
  cross_attn_dropout: 0.2
  cross_attn_drop_path: 0.1
  backbone_dropout: 0.2
  visual_cnn_dropout: 0.15
  classifier_dropout: 0.35
  text_dropout: 0.2
  text_freeze_layers: 12
  visual_freeze_layers: 9
  # ← v11과 다른 유일한 설정.
  prosody_fusion: "concat"

text:
  pretrained_model: "klue/bert-base"

audio:
  backbone: "wav2vec2"
  pretrained_model: "models/wav2vec2-large-xlsr-53"
  w2v_layer: 12
  w2v_freeze: true
  sample_rate: 16000
  n_mels: 80
  n_fft: 400
  hop_length: 160

visual:
  face_size: 112

train:
  batch_size: 128
  epochs: 40
  lr: 0.0002
  weight_decay: 0.05
  modality_dropout_prob: 0.25
  label_smoothing: 0.1
  lr_scheduler_patience: 3
  lr_scheduler_factor: 0.5
  num_workers: 8
  feature_cache_dir: "data/feature_cache"

  train_manifest: "data/manifests_si/train.csv"
  val_manifest: "data/manifests_si/val.csv"
  test_manifest: "data/manifests_si/test.csv"
  prosody_stats_path: "data/prosody_stats_train_si.json"

  checkpoint_dir: "checkpoints_prosody_concat"
  periodic_checkpoint_dir: "checkpoints_periodic_prosody_concat"
  checkpoint_interval: 20
