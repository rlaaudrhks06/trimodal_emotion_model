# ⚠️ 이 파일은 v5 당시(8클래스) 설정을 남긴 기록용이며 **지금 코드로는 실행되지 않는다**.
#   8.10절에서 경멸을 혐오에 병합해 src/datasets/labels.py가 7클래스로 고정됐기 때문에,
#   num_classes=8로 학습을 걸면 클래스 가중치(7개)와 로짓(8개)이 안 맞아 첫 배치에서 죽는다.
#   v5를 재현하려면 config가 아니라 labels.py의 LABEL_MERGE를 되돌려야 한다.
# config_prosody_norm.yaml(v4 recipe)과 동일한 규제·prosody 정규화 설정에,
# 8.7절 베이스라인 결과에 따라 영상 백본만 사전학습 모델로 교체한 실험용 설정.
# checkpoint_dir을 분리해 v4와 안 겹치게 한다.
#
# 이 파일로 백본을 두 번 갈아끼우며 재사용했다(체크포인트 디렉터리는 그대로):
#   1) ImageNet 사전학습 MobileNetV3-Small — 개선 없음, 더 빨리 과적합해서 폐기.
#   2) 얼굴인식 사전학습 MobileFaceNet(emotiefflib mbf_va_mtl) — 역시 개선 없었고
#      (val_acc 23.89%), 원인은 §8.8에서 밝혀짐: face_frames_dir가 애초에 얼굴이
#      아니라 AI Hub의 인물(person) bbox를 그대로 크롭한 전신 이미지였음.
#      scripts/refix_face_crops.py로 얼굴 재검출+정렬 후 재학습 필요.
model:
  d_model: 256
  n_heads: 8
  ffn_dim: 1024
  backbone_layers: 2
  num_classes: 8
  prosody_dim: 10
  cross_attn_dropout: 0.2
  backbone_dropout: 0.2
  visual_cnn_dropout: 0.15
  classifier_dropout: 0.35
  text_dropout: 0.2
  text_freeze_layers: 8
  visual_freeze_layers: 9   # 0보다 크면 MobileFaceNet 백본 전체 동결(§8.8)

text:
  pretrained_model: "klue/bert-base"

audio:
  sample_rate: 16000
  n_mels: 80
  n_fft: 400
  hop_length: 160

visual:
  face_size: 112

train:
  batch_size: 128
  epochs: 100
  lr: 0.0002
  weight_decay: 0.05
  modality_dropout_prob: 0.25
  label_smoothing: 0.1
  lr_scheduler_patience: 3
  lr_scheduler_factor: 0.5
  num_workers: 8
  feature_cache_dir: "data/feature_cache"
  train_manifest: "data/manifests/train.csv"
  val_manifest: "data/manifests/val.csv"
  test_manifest: "data/manifests/test.csv"
  prosody_stats_path: "data/prosody_stats_train.json"
  # --- 이 파일에서만 다른 부분: v4와 겹치지 않는 체크포인트 경로 ---
  checkpoint_dir: "checkpoints_visual_pretrained"
  periodic_checkpoint_dir: "checkpoints_periodic_visual_pretrained"
  checkpoint_interval: 20

