# 모달리티별 보조 라벨 학습 (v12) — config_si_w2v.yaml(v11)에서 보조 손실만 추가.
#
# **왜 이걸 하는가 (11.2절)**
#
# AI Hub 원본은 발화마다 감정 라벨을 네 개 갖고 있다(image/sound/text/multimodal).
# 우리가 정답으로 쓰는 multimodal 라벨과 나머지 셋의 일치율을 5,637개에서 집계했더니:
#
#   소리 라벨   77.35%
#   영상 라벨   41.69%
#   텍스트 라벨 30.87%
#   넷 다 일치  10.20%
#
# 즉 우리 정답은 사실상 "소리로 판단한 감정"이다. 그런데 v1~v11은 세 브랜치 모두에게
# 이 정답 하나를 맞히라고 요구했다. 영상 브랜치는 **화면이 58% 반박하는 답**을 내놓아야
# 하므로 배울 근거가 없고, 남는 방법은 촬영 맥락(배경·조명·인물)을 외우는 것뿐이다.
#
# 이 추측은 프로빙으로 확인됐다(11.1절):
#   - 세 브랜치 모두 감정보다 화자/촬영분 정보를 약 3배 더 담고 있었다
#     (정규화 상승폭: 시각 25.3% vs 81.0%, 오디오 24.0% vs 74.4%, 텍스트 23.6% vs 69.0%)
#   - 화자를 고정하면 같은 표본 수에서 감정 신호가 2.26배가 됐다(8.7% -> 19.7%)
#   - 화자 평균을 빼는 것으로는 안 나아졌다(-0.15%p) — 평행이동이 아니라는 뜻
#
# v12는 각 브랜치에 **자기 입력에 답이 있는 보조 과제**를 준다.
# 근거: Caruana(1997) 이래 표준인 다중 과제 학습 — 보조 과제가 공유 표현에 추가 제약을
# 걸어 일반화를 돕는다.
#
# **v11에서 바뀌는 것은 아래 두 줄뿐이다**(model.aux_head_dim, train.aux_loss_weight).
# 나머지는 전부 동일하게 두어 "보조 학습" 효과만 분리해서 본다.
model:
  d_model: 256
  n_heads: 8
  ffn_dim: 1024
  backbone_layers: 2
  num_classes: 7
  prosody_dim: 10
  cross_attn_dropout: 0.2
  cross_attn_drop_path: 0.1
  backbone_dropout: 0.2
  visual_cnn_dropout: 0.15
  classifier_dropout: 0.35
  text_dropout: 0.2
  text_freeze_layers: 12
  visual_freeze_layers: 9

  # ← v11과 다른 부분 ①. 보조 헤드의 은닉 차원.
  # 0이면 헤드를 안 만들어 v11과 파라미터까지 동일하다. 256은 d_model과 같은 값으로,
  # 분류기 앞단(HybridClassifier의 은닉 512)보다 작게 잡았다 — 보조 헤드가 커지면
  # 브랜치 표현을 개선하는 대신 헤드 자체가 답을 외울 수 있기 때문이다.
  # 추가되는 학습 파라미터는 202,773개(836만 -> 857만, 약 2.4% 증가).
  aux_head_dim: 256

text:
  pretrained_model: "klue/bert-base"

audio:
  backbone: "wav2vec2"
  pretrained_model: "models/wav2vec2-large-xlsr-53"
  # 12층 유지. 층 스윕(val 4,000개, 층 7개, 5회 반복)에서 층 간 최대 차이 2.18%p가
  # 반복 간 표준편차 0.92%p의 2배를 넘지 못해 유의하지 않았다 — 층은 병목이 아니다.
  # 참고로 그 실험의 부수 발견: 평균 풀링한 특징의 상승폭이 +3.75%p인데 학습된 오디오
  # 단독 모델은 +12.48%p(3.3배)였다. 감정이 시간 평균이 아니라 시간적 변화에 있다는 뜻.
  w2v_layer: 12
  w2v_freeze: true
  sample_rate: 16000
  n_mels: 80
  n_fft: 400
  hop_length: 160

visual:
  face_size: 112

train:
  batch_size: 128
  epochs: 40
  lr: 0.0002
  weight_decay: 0.05
  modality_dropout_prob: 0.25
  label_smoothing: 0.1
  lr_scheduler_patience: 3
  lr_scheduler_factor: 0.5
  num_workers: 8
  feature_cache_dir: "data/feature_cache"

  # ← v11과 다른 부분 ②. 보조 손실의 가중치.
  #   총손실 = 주손실 + 0.3 x (영상보조 + 오디오보조 + 텍스트보조)
  #
  # 0.3으로 시작하는 이유: 보조 항이 셋이라 합치면 주 손실과 비슷한 크기가 된다
  # (실측 초기값 주손실 약 1.7 vs 보조합 약 5.7 -> 0.3을 곱하면 약 1.7로 맞먹는다).
  # 이보다 크면 보조 과제가 주 과제를 밀어낼 수 있고, 작으면 효과가 안 난다.
  # 첫 실험에서 보조 손실이 잘 내려가는데 val_acc가 안 오르면 0.1로, 보조 손실이
  # 거의 안 내려가면 0.5로 조정한다.
  aux_loss_weight: 0.3

  # 보조 라벨 컬럼(label_image/label_sound/label_text)이 들어 있어야 한다.
  # 없으면 학습 시작 전에 명확한 오류로 중단된다. 채우는 명령:
  #   python scripts/add_modality_labels.py --raw-dir data/raw/aihub_full \
  #       --manifests data/manifests_si/train.csv data/manifests_si/val.csv \
  #                   data/manifests_si/test.csv
  train_manifest: "data/manifests_si/train.csv"
  val_manifest: "data/manifests_si/val.csv"
  test_manifest: "data/manifests_si/test.csv"
  prosody_stats_path: "data/prosody_stats_train_si.json"

  checkpoint_dir: "checkpoints_v12_aux"
  periodic_checkpoint_dir: "checkpoints_periodic_v12_aux"
  # v11이 9에폭에서 정점이었고 이후 val_loss가 5에폭 연속 올랐다. 보조 학습이 과적합을
  # 늦추면 정점이 뒤로 밀릴 수 있으므로 10으로 좁혀 그 구간 스냅샷을 확보한다.
  # 체크포인트 1개가 1.63GB라 40에폭이면 스냅샷 4개(6.5GB).
  checkpoint_interval: 10
